name: Nexus backend security tests

on:
  push:
    branches:
      - security/remediate-auth-cors-reset-20261109
    paths:
      - "backend/**"
      - ".github/workflows/nexus-backend-security.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/nexus-backend-security.yml"

permissions:
  contents: read

concurrency:
  group: nexus-backend-security-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
